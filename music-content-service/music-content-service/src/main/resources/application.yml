server:
  port: 8085

spring:
  application:
    name: music-content-service
  datasource:
    url: jdbc:postgresql://localhost:5432/AudioCloud
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    config:
      enabled: false
      uri: http://localhost:8888
      name: music-content-service
      profile: default
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

jwt:
  secret: ${secretKey}
  expiration: 86400000

logging:
  level:
    org.springframework.security: DEBUG
    ua.dymohlo.musiccontentservice: DEBUG
    org.springframework.cloud.netflix.eureka: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    org.springframework.web.multipart: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always