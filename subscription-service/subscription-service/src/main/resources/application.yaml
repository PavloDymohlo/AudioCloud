server:
  port: 8083

spring:
  application:
    name: subscription-service

  datasource:
    url: jdbc:postgresql://localhost:5432/AudioCloud
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

jwt:
  secret: ${secretKey}
  expiration: 86400000

logging:
  level:
    org.springframework.security: DEBUG
    ua.dymohlo.subscriptionservice: DEBUG
    org.springframework.cloud.netflix.eureka: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true

swagger:
  info:
    title: Subscription Management Service API
    description: Subscription plans management service for AudioCloud microservices. Handles subscription creation, updates, retrieval, and deletion with different access levels and pricing tiers.
    version: 1.0.0
    contact:
      name: Dymohlo Team
      email: support@audiocloud.ua
      url: https://audiocloud.ua
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT
  server:
    url: http://localhost:8083
    description: Development Subscription Management Service Server
  security:
    scheme-name: Bearer Authentication
    description: JWT token required for protected endpoints