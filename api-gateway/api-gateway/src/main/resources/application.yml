server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      uri: http://localhost:8888
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/config/**
        - id: discovery-service
          uri: lb://discovery-service
          predicates:
            - Path=/eureka/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
        - id: user-service-load-balanced
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/v1/subscriptions/**
          filters:
            - StripPrefix=0
        - id: music-content-service
          uri: lb://music-content-service
          predicates:
            - Path=/api/v1/music-files/**
          filters:
            - StripPrefix=0
        - id: music-streaming-service
          uri: lb://music-content-service
          predicates:
            - Path=/api/v1/stream/**
          filters:
            - StripPrefix=0

user-service:
  name: user-service
  api:
    base-path: /api/v1/users

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.server: DEBUG
    reactor.netty: DEBUG
    org.springframework.security: DEBUG
    ua.dymohlo.api_gateway.filter: DEBUG
    ua.dymohlo.api_gateway.service: DEBUG

load-balancer:
  services:
    - name: user-service
      port: "8084"
      weight: 1
      enabled: true
    - name: user-service-2
      port: "8081"
      weight: 1
      enabled: true
  enabled-paths:
    - "/api/v1/users"
  excluded-paths:
    - "/saga"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    urls:
      - name: API Gateway
        url: /v3/api-docs
        display-name: API Gateway
      - name: Auth Service
        url: http://localhost:8083/v3/api-docs
        display-name: Authentication Service
      - name: User Service
        url: http://localhost:8084/v3/api-docs
        display-name: User Management Service
      - name: User Service 2
        url: http://localhost:8081/v3/api-docs
        display-name: User Management Service (Instance 2)
      - name: Subscription Service
        url: http://localhost:8085/v3/api-docs
        display-name: Subscription Management
      - name: Music Content Service
        url: http://localhost:8086/v3/api-docs
        display-name: Music Content & Streaming

swagger:
  info:
    title: AudioCloud API Gateway
    description: Central API Gateway for AudioCloud microservices architecture. Routes requests to Auth, User, Subscription, Payment, Music Content, and Notification services.
    version: 1.0.0
    contact:
      name: Dymohlo Team
      email: support@audiocloud.ua
      url: https://audiocloud.ua
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT
  server:
    url: http://localhost:8080
    description: Development API Gateway Server
  security:
    scheme-name: Bearer Authentication
    description: JWT token obtained from /api/v1/auth/login