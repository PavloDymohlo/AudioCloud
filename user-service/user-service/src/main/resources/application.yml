server:
  port: 8084

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/AudioCloud
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

logging:
  level:
    org.springframework.security: DEBUG
    ua.dymohlo.auth_service: DEBUG

jwt:
  secret: ${secretKey}
  expiration: 86400000

subscription:
  service-name: subscription-service
  scheme: http
  api:
    base-path: "/api/v1"
    subscriptions-endpoint: "/subscriptions"

payment:
  service-name: payment-service
  scheme: http
  api:
    base-path: "/api/v1"
    process-endpoint: "/payment"
  default-provider: "liqpay"
