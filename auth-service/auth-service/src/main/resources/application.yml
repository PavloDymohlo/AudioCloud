server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/AudioCloud
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: ua.dymohlo.user_service.dto.event.UserDeletedEvent:ua.dymohlo.auth_service.dto.event.UserDeletedEvent

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

logging:
  level:
    org.springframework.security: DEBUG
    ua.dymohlo.auth_service: DEBUG

jwt:
  secret-key: ${secretKey}
  expiration: 86400000

subscription:
  service-name: subscription-service
  scheme: http
  default-plan: "TRIAL"
  api:
    base-path: "/api/v1"
    subscriptions-endpoint: "/subscriptions"

payment:
  service-name: payment-service
  scheme: http
  api:
    base-path: "/api/v1"
    process-endpoint: "/payment"
  default-provider: "liqpay"