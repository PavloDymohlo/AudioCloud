server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/AudioCloud
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: auth_service
    table: flyway_schema_history

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: ua.dymohlo.user_service.dto.event.UserDeletedEvent:ua.dymohlo.auth_service.dto.event.UserDeletedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost

logging:
  level:
    org.springframework.security: DEBUG
    ua.dymohlo.auth_service: DEBUG

jwt:
  secret-key: ${secretKey}
  expiration: 86400000

subscription:
  service-name: subscription-service
  scheme: http
  default-plan: "TRIAL"
  api:
    base-path: "/api/v1"
    subscriptions-endpoint: "/subscriptions"

payment:
  service-name: payment-service
  scheme: http
  api:
    base-path: "/api/v1"
    process-endpoint: "/payment"
  default-provider: "liqpay"

saga:
  internal-api-key: "saga-internal-key-9f2e8d7c6b5a4918273645ebf0c1a2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true

swagger:
  info:
    title: Authentication Service API
    description: Authentication and authorization service for AudioCloud microservices. Handles user registration, login, JWT token management, and SAGA-based user creation with payment processing.
    version: 1.0.0
    contact:
      name: Dymohlo Team
      email: support@audiocloud.ua
      url: https://audiocloud.ua
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT
  server:
    url: http://localhost:8082
    description: Development Authentication Service Server
  security:
    scheme-name: Bearer Authentication
    description: JWT token required for protected endpoints